<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zytrix — Entrar</title>
  <meta name="description" content="Entre na sua conta Zytrix.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/features.css">
  <link rel="stylesheet" href="assets/css/figma.css">
</head>
<body class="figma-page figma-auth-page">
  <main class="figma-auth-shell">
    <form class="figma-auth-card" data-auth-form data-mode="login">
      <a class="figma-brand figma-auth-brand" href="index.html" aria-label="Zytrix - Início">
        <span class="figma-brand-mark">Z</span>
        <span class="figma-brand-name">Zytrix</span>
      </a>

      <h1>Entrar</h1>

      <div class="form-group">
        <label for="login-email">E-mail</label>
        <input class="input" id="login-email" name="email" required type="email" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="login-password">Senha</label>
        <input class="input" id="login-password" name="password" required type="password" autocomplete="current-password">
      </div>

      <button class="figma-auth-primary" type="submit">Entrar</button>

      <a class="figma-auth-link" href="recuperar-senha.html">Esqueci minha senha</a>

      <button class="figma-auth-google" id="google-login" type="button">Entrar com Google</button>

      <p class="figma-auth-switch">Não possui conta? <a href="registro.html">Registrar</a></p>
      <div class="hidden" id="message"></div>
    </form>
  </main>

  <script src="assets/js/auth-pages.js" type="module"></script>
</body>
</html>
