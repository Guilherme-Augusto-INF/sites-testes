<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zytrix — Ao Vivo</title>
  <meta name="description" content="Descubra quem está transmitindo neste momento na Zytrix.">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="googlebot" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://zytrix-tcc.vercel.app/ao-vivo.html">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/figma.css">
</head>
<body class="figma-page figma-live-list-page">
  <div data-header></div>

  <main class="figma-main">
    <div class="figma-container">
      <section class="live-list-hero" aria-labelledby="live-list-title">
        <div class="figma-eyebrow">• TRANSMISSÕES</div>
        <h1 id="live-list-title">Ao vivo agora</h1>
        <p>Descubra quem está transmitindo neste momento.</p>
      </section>

      <section class="live-browser" aria-label="Transmissões ao vivo">
        <div class="live-browser-toolbar">
          <div id="filters" class="home-live-filters"></div>

          <label class="figma-search live-browser-search" aria-label="Pesquisar lives">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l5 5"></path></svg>
            <input id="search" type="search" placeholder="Pesquisar lives...">
          </label>
        </div>

        <div id="lives-grid" class="live-browser-grid">
          <div class="figma-state">Carregando transmissões...</div>
        </div>

        <div class="live-browser-watch">
          <a id="live-browser-watch-button" class="figma-btn figma-btn-watch is-disabled" href="live.html" aria-disabled="true">Assistir Live</a>
        </div>
      </section>
    </div>
  </main>

  <div data-footer></div>
  <script type="module" src="assets/js/ao-vivo.js"></script>
</body>
</html>
