<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zytrix — Categoria</title>
  <meta name="description" content="Explore transmissões ao vivo por categoria e subcategoria na Zytrix.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/figma.css">
</head>
<body class="figma-page figma-category-page">
  <div data-header></div>

  <main class="figma-main">
    <div class="figma-container">
      <section class="category-page-hero">
        <div class="category-page-heading">
          <span class="category-page-icon" id="category-icon"></span>
          <div>
            <div class="figma-eyebrow">• CATEGORIA</div>
            <h1 id="category-title"></h1>
            <p>Encontre transmissões ao vivo nesta categoria.</p>
          </div>
        </div>
      </section>

      <nav class="category-subnav" id="subcategories" aria-label="Subcategorias"></nav>

      <section class="category-live-area" aria-label="Lives da categoria">
        <div id="category-lives" class="category-live-grid">
          <div class="figma-state">Procurando lives...</div>
        </div>

        <div class="category-watch-row">
          <a id="category-watch-button" class="figma-btn figma-btn-watch is-disabled" href="live.html" aria-disabled="true">Assistir Live</a>
        </div>
      </section>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/js/categoria.js" type="module"></script>
</body>
</html>
