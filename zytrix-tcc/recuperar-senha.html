<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zytrix — Recuperar senha</title>
  <meta name="description" content="Recupere o acesso à sua conta Zytrix.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/features.css">
  <link rel="stylesheet" href="assets/css/figma.css">
</head>
<body class="figma-page figma-auth-page">
  <main class="figma-auth-shell figma-reset-shell">
    <form class="figma-reset-card" data-auth-form data-mode="reset">
      <a class="figma-brand figma-reset-brand" href="index.html" aria-label="Zytrix - Início">
        <span class="figma-brand-mark">Z</span>
        <span class="figma-brand-name">Zytrix</span>
      </a>

      <h1>Recuperar senha</h1>
      <p>Digite o e-mail cadastrado para receber o link de redefinição.</p>

      <div class="form-group">
        <label for="reset-email">E-mail</label>
        <input class="input" id="reset-email" name="email" required type="email" autocomplete="email">
      </div>

      <button class="figma-auth-primary" type="submit">Enviar link</button>
      <a class="figma-auth-link" href="login.html">Voltar para entrar</a>
      <div class="hidden" id="message"></div>
    </form>
  </main>

  <script src="assets/js/auth-pages.js" type="module"></script>
</body>
</html>
