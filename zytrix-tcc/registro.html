<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zytrix — Registrar</title>
  <meta name="description" content="Crie sua conta Zytrix.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/features.css">
  <link rel="stylesheet" href="assets/css/figma.css">
</head>
<body class="figma-page figma-auth-page">
  <main class="figma-auth-shell">
    <form class="figma-auth-card figma-register-card" data-auth-form data-mode="register">
      <a class="figma-brand figma-auth-brand" href="index.html" aria-label="Zytrix - Início">
        <span class="figma-brand-mark">Z</span>
        <span class="figma-brand-name">Zytrix</span>
      </a>

      <h1>Registrar</h1>

      <div class="form-group">
        <label for="register-username">Nome de usuário</label>
        <input class="input" maxlength="30" minlength="2" id="register-username" name="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="register-email">E-mail</label>
        <input class="input" id="register-email" name="email" required type="email" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="register-password">Senha</label>
        <input class="input" minlength="10" id="register-password" name="password" required type="password" autocomplete="new-password">
      </div>

      <button class="figma-auth-primary" type="submit">Criar conta</button>
      <button class="figma-auth-google" id="google-login" type="button">Entrar com Google</button>

      <p class="figma-auth-switch">Já possui conta? <a href="login.html">Entrar</a></p>
      <div class="hidden" id="message"></div>
    </form>
  </main>

  <script src="assets/js/auth-pages.js" type="module"></script>
</body>
</html>
