<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil – Visite Barueri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/profile.js" defer></script>
</head>
<body>
<main>
<section class="page auth profile-page">
  <a class="home" href="index.html" title="Início">🏠</a>
  <form class="caixa profile-card" id="profile-form">
    <h2>Meu perfil</h2>
    <div class="profile-avatar" id="profile-avatar-preview">👤</div>
    <label>Foto de perfil:
      <input id="avatar-file" type="file" accept="image/*">
    </label>
    <label>Email:
      <input id="profile-email" type="email" readonly>
    </label>
    <label>Nome de usuário:
      <input id="profile-username" type="text" maxlength="30" placeholder="ex.: isaque123" autocomplete="username">
    </label>
    <label>Nome completo:
      <input id="profile-full-name" type="text" maxlength="80" placeholder="Seu nome completo" autocomplete="name">
    </label>
    <label>Bio:
      <textarea id="profile-bio" rows="4" maxlength="280" placeholder="Conte um pouco sobre você..."></textarea>
    </label>
    <p class="profile-note">O ID da conta é gerado automaticamente e não pode ser alterado.</p>
    <p id="profile-message" class="profile-message" role="alert" aria-live="polite"></p>
    <button class="btn" type="submit" id="save-profile">Salvar alterações</button>
    <a class="profile-back" href="index.html">Voltar para o site</a>
  </form>
</section>
</main>
<footer class="rodape">© 2026 – Visite Barueri</footer>
</body>
</html>
